<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEO 运营系统 · 登录</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; background:#f1f5f9; color:#334155; }
  .card { background:#fff; border-radius:14px; padding:36px 40px; box-shadow:0 6px 24px rgba(15,23,42,.08); width:300px; }
  h1 { font-size:18px; text-align:center; margin:0 0 6px; }
  p { font-size:13px; color:#64748b; text-align:center; margin:0 0 18px; }
  label { display:block; font-size:12px; color:#64748b; margin-bottom:6px; }
  input { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #e2e8f0; border-radius:8px; font-size:14px; outline:none; }
  input:focus { border-color:#4f6ef7; box-shadow:0 0 0 3px rgba(79,110,247,.12); }
  button { width:100%; margin-top:14px; padding:10px 0; border:0; border-radius:8px; background:#4f6ef7; color:#fff; font-size:14px; cursor:pointer; }
  .msg { min-height:18px; font-size:12px; color:#ef4444; margin-top:10px; text-align:center; }
</style></head><body>
<div class="card">
  <h1>GEO 运营系统</h1><p>请输入访问口令</p>
  <form id="f">
    <label for="code">访问口令</label>
    <input type="password" id="code" autofocus>
    <button id="btn" type="submit">登 录</button>
  </form>
  <div class="msg" id="msg"></div>
</div>
<script>
/* 口令 → SHA-256(盐+口令) 匹配角色 → 角色页用口令派生密钥解密载荷。
   页面里只有盐和哈希，没有口令本体；载荷是密文，口令错误解不开。 */
var ROLES = [{"role":"team","salt":"b345743a777f5d8213dbc44059bca31a","hash":"7fb57895473e30556a738346e4609343061cddd040a87da7131529b0debb4b12"},{"role":"demo","salt":"ee5d09bde4858c9f7031aaabf3ca6a6e","hash":"061f544c9fa7b32572f9fff5a1e2aefe11a28ad6ca57f37093835ef52f49fdb9"},{"role":"admin","salt":"681eb2635e44b7d648b2b135aefec238","hash":"4f722d412eeb7777e0c9e6aeffab409b7fad14a0d343ed2cf79510dd7928aad8"}];
var f = document.getElementById('f'), code = document.getElementById('code'),
    btn = document.getElementById('btn'), msg = document.getElementById('msg');
async function sha256hex(s) {
  var d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(d)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
}
f.addEventListener('submit', async function (e) {
  e.preventDefault();
  var v = code.value;
  if (!v) { msg.textContent = '请输入口令'; return; }
  btn.disabled = true; msg.style.color = '#94a3b8'; msg.textContent = '验证中…';
  var hit = null;
  for (var i = 0; i < ROLES.length; i++) {
    if (await sha256hex(ROLES[i].salt + ':' + v) === ROLES[i].hash) { hit = ROLES[i]; break; }
  }
  if (hit) {
    try { sessionStorage.setItem('geo_gh_pw', v); } catch (e2) {}
    msg.style.color = '#22b07d'; msg.textContent = '通过，正在进入…';
    setTimeout(function () { location.href = hit.role + '.html'; }, 300);
  } else {
    msg.style.color = '#ef4444'; msg.textContent = '口令不正确';
    btn.disabled = false; code.select();
  }
});
</script>
</body></html>
